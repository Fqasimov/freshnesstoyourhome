<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freshness — İdarə paneli</title>
<!--
  Kept out of every search index and every referrer. The panel is protected by
  the API's role check rather than by being hard to find, but there is no
  reason to help anyone find it.
-->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F3EA">
<!-- The shop's own faces, so the panel reads as part of the same brand. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Inline, so the panel has no favicon request to 404 on and its tab is
     distinguishable from the shop's when both are open. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233A6A2C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23EFE24E'/%3E%3C/svg%3E">
</head>

<div id="admin"></div>
<script type="module" src="/src/admin/main.js"></script>
</body>
</html>
