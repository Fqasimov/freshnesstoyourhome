<!--
  Two requests, because they ask for different things.

  Vollkorn and Onest carry everything that gets translated, so both have to
  cover the Azerbaijani schwa (ə, Ə) and Cyrillic — checked against the actual
  glyph tables, not assumed. Vollkorn is a warm, slightly rough bookface whose
  name means "wholegrain"; it reads like a farm shop rather than a perfume ad.

  Fraunces is the wordmark alone, with its soft serifs and the WONK axis on.
  It has no Cyrillic at all, which is why it is never allowed near translated
  text — and why `text=` can subset it to the thirteen letters in "Freshness to
  your home". That is 4 KB rather than 90, and it cannot be reused by accident:
  any other character simply falls through to the next font in the stack.
-->
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@144,400,80,1;144,600,80,1&text=FreshnstoyumTHY%20&display=swap" rel="stylesheet">
</head>
