<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the layout can reach under the notch and the home
     indicator, with safe-area insets doing the real spacing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Freshness To Your Home</title>
<meta name="theme-color" content="#3A6A2C">
<!-- The app ships its own fonts rather than fetching them: a customer opening
     the app on a bad connection should not wait on Google, and a shop app
     should not tell a third party every time it is opened. -->
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
