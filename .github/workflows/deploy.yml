# Test, build and upload freshness.az on every push.
#
# The host (hostinq.az, shared cPanel) has no shell, so nothing can be built
# there. This does on GitHub's machine what package-deploy.sh does on a
# laptop, then syncs the result over FTPS and runs migrations through the
# token-gated POST /api/deploy/migrate. Only changed files are sent: the
# action keeps a record of what it uploaded (.ftp-deploy-sync-state.json) and
# never touches anything it did not upload — .env, uploaded photos, logs.
#
# Off until the repository variable DEPLOY_ENABLED is "true" and these
# secrets exist: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, DEPLOY_TOKEN.
# See DEPLOY.md → "Automatic deploys".

name: Deploy

on:
  push:
    branches: [claude/photo-analysis-bgp25f]
    paths-ignore: ['**.md', 'app/**', '.claude/**']
  workflow_dispatch:
  # Every night, so the product pages written for search engines carry the
  # prices and products set in the panel that day. Only what changed is sent.
  schedule:
    - cron: '7 1 * * *'   # 05:07 in Baku
    # And every three hours a quick look: if anything in the panel changed
    # (a price, a name, stock), the pages are rebuilt so Google never reads
    # yesterday's price for long. Nothing changed: the run stops in seconds.
    - cron: '37 */3 * * *'

# One deploy at a time, in order: a second push waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only on the three-hourly run: has the catalogue changed since the pages
  # were built? web/scripts/prerender.mjs publishes catalogue-version.txt,
  # the fingerprint of the catalogue it built them from.
  changed:
    if: github.event.schedule == '37 */3 * * *' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
    steps:
      - id: compare
        run: |
          now=$(curl -fsS --retry 3 -H 'Accept: application/json' "https://freshness.az/server/api/catalogue" | sha256sum | cut -d' ' -f1)
          built=$(curl -fsS --retry 3 "https://freshness.az/catalogue-version.txt" || true)
          echo "live $now, pages built from ${built:-nothing}"
          if [ "$now" = "$built" ]; then echo "rebuild=false" >> "$GITHUB_OUTPUT"; else echo "rebuild=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: changed
    # always(): the check above is skipped on every other kind of run.
    # Only from the release branch. "Run workflow" lets anyone with write
    # access pick any branch; that must not be a way to ship unreviewed code.
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/claude/photo-analysis-bgp25f'
      && (needs.changed.result == 'skipped' || needs.changed.outputs.rebuild == 'true')
    runs-on: ubuntu-latest
    # The first run sends ~13,800 files (vendor/) one at a time over FTP;
    # later runs send only what changed and take a few minutes.
    timeout-minutes: 180
    env:
      DOMAIN: freshness.az
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # The host's version. composer.json pins the platform to it too.
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, intl, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ---- Nothing goes up unless all of this passes ----------------------
      - name: Backend tests
        # The code did not change on a catalogue refresh; only the pages do.
        if: github.event.schedule != '37 */3 * * *'
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test

      - name: Website build and drift check
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          # The website's photo copies are generated from shared/products and
          # not committed, so a fresh checkout has none. Copy them first; the
          # check then still fails on any committed generated file that is
          # out of step with shared/.
          node --input-type=module -e "import('../scripts/shared-photos.mjs').then(m => m.syncPhotos({ write: true, log: false }))"
          npm run check

      # ---- Build exactly what the server gets -----------------------------
      - name: Stage the home folder
        env:
          # Optional. A browser key for the basket's map pin picker, restricted
          # to freshness.az in Google Cloud. Unset, the picker is
          # left out and "use my location" still works.
          VITE_GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_KEY }}
          # Optional: Google Analytics 4 measurement id (G-XXXX) and the
          # Yandex / Bing ownership codes. Empty = not loaded.
          VITE_GA4_ID: ${{ vars.GA4_ID }}
          VITE_YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          VITE_BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
        run: |
          STAGE_OUT="$RUNNER_TEMP/site" scripts/package-deploy.sh
          # hostinq.az's FTPS server rejects zero-byte files ("tlsv1 alert
          # decode error" on the data socket), which ends the whole upload.
          # The empty files are placeholders and library test fixtures that
          # nothing on the server reads, so they are left out.
          echo "Leaving out $(find "$RUNNER_TEMP/site" -type f -empty | wc -l) empty file(s)"
          find "$RUNNER_TEMP/site" -type f -empty -delete

      # ---- Upload: backend first, so the site never calls code that is not
      #      there yet -----------------------------------------------------
      - name: Upload ~/freshness
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Verify the server's certificate, or the FTP password goes to
          # whoever answers. FTP_SERVER must be a name the host's certificate
          # covers (cPanel's is usually the server's own hostname, e.g.
          # serverNN.hostinq.az, not ftp.<domain>).
          security: strict
          local-dir: ${{ runner.temp }}/site/freshness/
          server-dir: freshness/
          exclude: |
            **/.git*
            **/.git*/**
            backend/storage/logs/**
            backend/storage/framework/**

      - name: Run database migrations
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/json" \
            "https://$DOMAIN/server/api/deploy/migrate"

      # The product pages and sitemap were written at build time from the API
      # as it was then. Now the database is migrated, write them again from
      # what it says today; if it does not answer, the build's pages stay.
      - name: Product pages from the live catalogue
        env:
          PRERENDER_API: https://${{ env.DOMAIN }}/server
          PRERENDER_LIVE_ONLY: '1'
          GBP_URL: ${{ vars.GBP_URL }}
        run: node web/scripts/prerender.mjs "${{ runner.temp }}/site/public_html"

      - name: Upload ~/public_html
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ${{ runner.temp }}/site/public_html/
          server-dir: public_html/

      # ---- Did it work? ----------------------------------------------------
      - name: Smoke test the live site
        run: |
          curl -fsS "https://$DOMAIN/" | grep -q '<div id="app"'
          curl -fsS "https://$DOMAIN/server/api/catalogue" | grep -q '"products"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/.env")" = 403
          echo "Live and healthy."
